# MuleGuard Local — Transaction categorization rules (deterministic regex/keyword)
# User-editable. Changes take effect on next analysis.

categories:
  - name: "salary"
    match_any: ["salary", "sal credit", "payroll", "salary credit"]
    direction: credit

  - name: "utility_bill"
    match_any: ["electricity", "recharge", "broadband", "dth", "water bill", "gas bill"]
    direction: debit

  - name: "peer_transfer"
    match_any: ["upi", "neft", "imps", "rtgs"]
    direction: any

  - name: "cash"
    match_any: ["atm", "cash wdl", "atw", "cash withdrawal"]
    direction: debit

  - name: "interest"
    match_any: ["int credit", "interest", "interest credited"]
    direction: credit

  - name: "charges"
    match_any: ["charges", "service charge", "maintenance fee", "penalty"]
    direction: debit

  - name: "reversal"
    match_any: ["reversal", "rev", "reversed"]
    direction: any

  - name: "emi"
    match_any: ["emi", "loan repayment", "auto debit"]
    direction: debit

  - name: "investment"
    match_any: ["mutual fund", "mf", "stock", "equity", "sip", "fixed deposit", "fd"]
    direction: debit

  - name: "rent"
    match_any: ["rent", "lease"]
    direction: debit

  - name: "tax"
    match_any: ["tax", "gst", "income tax", "tds"]
    direction: debit

  - name: "shopping"
    match_any: ["amazon", "flipkart", "myntra", "swiggy", "zomato", "blinkit", "zepto"]
    direction: debit

  - name: "travel"
    match_any: ["flight", "train", "irctc", "makemytrip", "booking", "uber", "ola"]
    direction: debit

## Channel patterns (Section 8.1)
channels:
  UPI:
    patterns:
      - "UPI/"
      - "\\w[\\w.\\-]+@\\w+"
  NEFT:
    patterns:
      - "NEFT"
      - "NEFT-"
  RTGS:
    patterns:
      - "RTGS"
      - "RTGS-"
  IMPS:
    patterns:
      - "IMPS"
      - "IMPS-"
  ATM:
    patterns:
      - "\\bATM\\b"
      - "CASH WDL"
      - "ATW"
  POS:
    patterns:
      - "\\bPOS\\b"
      - "POS "
      - "SWIPE"
  CHEQUE:
    patterns:
      - "CHQ"
      - "CHEQUE"
      - "CH\\.?\\s*NO"
  INTEREST:
    patterns:
      - "INT\\s+CREDIT"
      - "INTEREST"
  CHARGES:
    patterns:
      - "CHARGES"
      - "SERVICE CHARGE"
      - "MAINTENANCE"
  INTERNAL_TRANSFER:
    patterns:
      - "OWN A/C"
      - "SELF TRANSFER"
      - "TRANSFER TO OWN"
