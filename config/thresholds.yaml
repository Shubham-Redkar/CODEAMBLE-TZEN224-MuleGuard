# MuleGuard Local — all thresholds in one place, human-editable
# Changing these takes effect immediately (no retrain needed for rule/anomaly layers).

## OOD Statement-Likelihood Score thresholds (Section 6.4)
ood:
  auto_proceed: 0.70
  low_confidence_upper: 0.70
  low_confidence_lower: 0.40
  hard_reject: 0.40

## OOD signal weights (must sum to ~1.0)
ood_weights:
  has_date_column: 0.20
  has_amount_columns: 0.20
  has_running_balance_column: 0.20
  has_bank_identity_markers: 0.15
  has_narration_column: 0.15
  row_count_plausible: 0.10

## Extraction confidence / reconciliation (Section 7.6)
reconciliation:
  high_confidence_min: 0.98
  medium_confidence_min: 0.85
  tolerance: 0.01

## Header classification (Section 7.4)
header_classification:
  template_match_threshold: 0.85
  field_min_acceptance: 0.55

## Column mapping heuristic weights (Section 7.4)
column_mapping:
  header_score_weight: 0.5
  content_score_weight: 0.5

## Categorization (Section 8)
categorization:
  fuzzy_match_threshold: 80
  counterparty_merge_threshold: 92

## Dormancy detection (Section 9.1)
dormancy:
  gap_days: 30
  burst_min_transactions: 3
  burst_window_days: 3

## Behavioral features (Section 9.2)
behavior:
  midnight_hour_start: 22
  midnight_hour_end: 6

## Structuring thresholds (Section 9.3)
structuring:
  near_threshold_bands:
    - threshold: 50000
      lower_pct: 0.90
    - threshold: 200000
      lower_pct: 0.90
  round_number_moduli:
    - 1000
    - 10000

## Benford's law (Section 9.3)
benford:
  significance_level: 0.95

## Cycle detection (Section 10)
cycle:
  max_cycle_length: 6
  dense_component_edge_cap: 1000
  min_cycle_risk_score: 0.6

## Cycle composite risk weights (Section 10.3)
cycle_risk_weights:
  amount_conservation: 0.35
  velocity_compression: 0.30
  cycle_recurrence: 0.20
  inverse_hop_count: 0.15

## Rule engine point assignments (Section 11.2)
rules:
  R1_low_retention_high_turnover:
    points: 25
    condition: "net_retention_ratio < 0.15 AND turnover_ratio > 8"
  R2_dormancy_then_burst:
    points: 15
    condition: "dormancy_breaks >= 1"
  R3_structuring_near_threshold:
    points: 20
    condition: "near_threshold_ratio > 0.3"
  R4_benford_anomaly:
    points: 10
    condition: "benford_deviation_score > critical_value_95"
  R5_circular_flow_detected:
    points: 30
    condition: "max_cycle_risk_score > 0.6"
  R6_fan_in_fan_out:
    points: 20
    condition: "fan_in_score > p90 AND net_retention_ratio < 0.2"

## Fusion weights (Section 11.5)
fusion:
  supervised_available:
    rule_score: 0.40
    anomaly_score: 0.25
    supervised_probability: 0.35
  supervised_unavailable:
    rule_score: 0.65
    anomaly_score: 0.35

## Three-tier decision policy (Section 11.6)
decision:
  confirmed_suspicious_min: 75
  likely_legitimate_max: 25

## Supervised model gate (Section 11.4)
supervised:
  min_labeled_accounts: 200

## Anomaly detection (Section 11.3)
anomaly:
  isolation_forest:
    n_estimators: 200
    random_state: 42
    contamination: "auto"
  robust_zscore_threshold: 3.5

## File size limits (Section 6.3)
file:
  max_size_mb: 50
  min_rows: 3
  min_columns: 3
